name: Rust checks

on:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        working-directory: core
        run: cargo fmt --check
      - name: Tests
        working-directory: core
        run: cargo test